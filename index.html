<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexFlow | Intelligent Supply Chain Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f3ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-modal { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
        
        /* PRINT SPECIFIC STYLES FOR PDF GENERATION */
        @media print {
            body * { visibility: hidden !important; }
            #printable-po-area, #printable-po-area * { visibility: visible !important; }
            #printable-po-area {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: #ffffff !important;
                color: #000000 !important;
                padding: 20px !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-20 md:pb-6">

    <!-- AUTHENTICATION OVERLAY -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl no-print">
        <div class="glass-modal w-full max-w-md rounded-2xl border border-slate-800 shadow-2xl p-6 space-y-5">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-500 mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="layers" class="w-7 h-7 text-white"></i>
                </div>
                <h2 class="text-xl font-bold text-white tracking-tight">VortexFlow Portal</h2>
                <p class="text-xs text-slate-400">Select Login Role</p>
            </div>

            <!-- ROLE SELECTOR TABS -->
            <div class="grid grid-cols-2 p-1 bg-slate-900 rounded-xl border border-slate-800">
                <button type="button" id="tab-role-admin" class="py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Master Admin</button>
                <button type="button" id="tab-role-client" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">Client Access</button>
            </div>

            <div class="space-y-4">
                <!-- MASTER ADMIN ONE-CLICK BYPASS (VISIBLE ONLY IN ADMIN TAB) -->
                <div id="admin-bypass-wrapper">
                    <button type="button" id="btn-direct-admin" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4"></i> ⚡ 1-Click Login as Master Admin (shalu@x-engi.in)
                    </button>
                    <div class="relative flex py-3 items-center">
                        <div class="flex-grow border-t border-slate-800"></div>
                        <span class="flex-shrink mx-3 text-[10px] text-slate-500 uppercase font-semibold">Or Password Login</span>
                        <div class="flex-grow border-t border-slate-800"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" value="shalu@x-engi.in" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <input type="password" id="login-password" value="admin123" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <button type="button" id="btn-standard-login" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-600/30 transition">
                    Sign In
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WORKSPACE -->
    <div id="app-workspace" class="hidden">
        <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 py-3 no-print">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                        <i data-lucide="layers" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                            VortexFlow
                            <span id="role-badge" class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Master Admin</span>
                        </h1>
                        <p class="text-xs text-slate-400">Logged in as: <span id="user-display-email" class="text-slate-200 font-mono">shalu@x-engi.in</span></p>
                    </div>
                </div>

                <button type="button" id="btn-logout" class="p-2 rounded-lg bg-slate-900/80 hover:bg-rose-900/30 text-slate-300 hover:text-rose-400 border border-slate-800 transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
            <section class="grid grid-cols-2 md:grid-cols-4 gap-4 no-print">
                <div class="glass-panel p-4 rounded-2xl border border-slate-800">
                    <span class="text-xs font-medium uppercase text-slate-400">Active Orders</span>
                    <div class="text-2xl font-bold text-white mt-1" id="stat-active-orders">0</div>
                </div>
                <div class="glass-panel p-4 rounded-2xl border border-slate-800">
                    <span class="text-xs font-medium uppercase text-slate-400">Completed</span>
                    <div class="text-2xl font-bold text-white mt-1" id="stat-completed">0 pcs</div>
                </div>
                <div class="glass-panel p-4 rounded-2xl border border-slate-800">
                    <span class="text-xs font-medium uppercase text-slate-400">Pattern Catalog</span>
                    <div class="text-2xl font-bold text-white mt-1" id="stat-patterns">899</div>
                </div>
                <div class="glass-panel p-4 rounded-2xl border border-slate-800">
                    <span class="text-xs font-medium uppercase text-slate-400">Clients Loaded</span>
                    <div class="text-2xl font-bold text-white mt-1" id="stat-clients">12</div>
                </div>
            </section>

            <section class="glass-panel rounded-2xl border border-slate-800 p-4">
                <div class="flex items-center justify-between mb-4 no-print">
                    <div>
                        <h2 class="text-base font-semibold text-white">Purchase Orders Ledger</h2>
                        <p class="text-xs text-slate-400">Real-time status and supplier tracking</p>
                    </div>
                    <button type="button" id="btn-open-create-modal" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i> Create Purchase Order
                    </button>
                </div>
                <div id="orders-card-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <!-- CREATE PO MODAL -->
    <div id="modal-create-order" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md no-print">
        <div class="glass-modal w-full max-w-2xl rounded-2xl border border-slate-800 p-5 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-base font-semibold text-white">Create Purchase Order</h3>
                <button type="button" id="btn-close-modal" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Target Client</label>
                    <input type="text" id="po-client" placeholder="e.g. Ashirwad / Chirai" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200">
                </div>
                <div id="foundry-field-container">
                    <label class="block text-xs text-slate-300 mb-1">Foundry Partner Name</label>
                    <input type="text" id="po-foundry" placeholder="Auto-fills on pattern typing" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs text-slate-300 mb-1">Pattern / Drawing No.</label>
                    <input type="text" id="po-pattern" placeholder="Type pattern no. e.g. 748-14-9091" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Quantity</label>
                    <input type="number" id="po-qty" value="10" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Target Date</label>
                    <input type="date" id="po-date" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-200">
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                <button type="button" id="btn-cancel-modal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">Cancel</button>
                <button type="button" id="btn-submit-po" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Submit Order</button>
            </div>
        </div>
    </div>

    <!-- PRINTABLE PDF CONTAINER -->
    <div id="printable-po-area" class="hidden"></div>

    <script>
        const PATTERN_CATALOG = {
            "748-14-9091": {"client": "Ashirwad", "foundry": "Castingcast"},
            "660-0551-778014": {"client": "Chirai", "foundry": "Castingcast"},
            "04-10-304": {"client": "Chirai", "foundry": "Charbhuja"},
            "05-10-256": {"client": "Chirai", "foundry": "Highton"},
            "8560324": {"client": "RMP", "foundry": "Charbhuja"},
            "8560325": {"client": "RMP", "foundry": "Charbhuja"},
            "720-32-200": {"client": "Chirai", "foundry": "Ashutosh"}
        };

        const MASTER_ADMIN = 'shalu@x-engi.in';
        let currentUser = null;
        let orders = [];

        function setLoginRole(role) {
            const adminTab = document.getElementById('tab-role-admin');
            const clientTab = document.getElementById('tab-role-client');
            const bypassWrapper = document.getElementById('admin-bypass-wrapper');
            const emailInput = document.getElementById('login-email');

            if (role === 'admin') {
                adminTab.className = "py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
                clientTab.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                bypassWrapper.classList.remove('hidden');
                emailInput.value = MASTER_ADMIN;
            } else {
                clientTab.className = "py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
                adminTab.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                bypassWrapper.classList.add('hidden'); // HIDE BYPASS FOR CLIENT
                emailInput.value = 'client@example.com';
            }
        }

        function loginUser(role) {
            const email = document.getElementById('login-email').value.trim() || (role === 'admin' ? MASTER_ADMIN : 'client@example.com');
            currentUser = { email: email, role: role };
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-workspace').classList.remove('hidden');
            document.getElementById('user-display-email').textContent = email;
            document.getElementById('role-badge').textContent = role === 'admin' ? 'Master Admin' : 'Client Access';

            if (role === 'client') {
                document.getElementById('foundry-field-container').classList.add('hidden');
            } else {
                document.getElementById('foundry-field-container').classList.remove('hidden');
            }

            renderOrders();
            lucide.createIcons();
        }

        function printOrderPDF(poId) {
            const order = orders.find(o => o.id === poId);
            if (!order) return;

            const isClient = currentUser && currentUser.role === 'client';
            const area = document.getElementById('printable-po-area');
            
            area.innerHTML = `
                <div style="font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; border: 2px solid #000;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px;">
                        <div>
                            <h1 style="margin: 0; font-size: 24px; text-transform: uppercase;">VortexFlow Supply Chain</h1>
                            <p style="margin: 2px 0; font-size: 12px; color: #555;">Purchase Order Document</p>
                        </div>
                        <div style="text-align: right;">
                            <h2 style="margin: 0; font-size: 18px;">${order.id}</h2>
                            <p style="margin: 2px 0; font-size: 12px;">Date: ${new Date().toLocaleDateString()}</p>
                        </div>
                    </div>

                    <div style="margin: 20px 0; display: flex; justify-content: space-between;">
                        <div>
                            <strong>Target Client:</strong> ${order.client}<br>
                            <strong>Target Delivery Date:</strong> ${order.targetDate}
                        </div>
                        ${!isClient ? `<div><strong>Assigned Foundry:</strong> ${order.foundry}</div>` : ''}
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-top: 20px;" border="1" cellpadding="8">
                        <thead>
                            <tr style="background-color: #f2f2f2;">
                                <th>Pattern / Drawing No.</th>
                                <th>Ordered Qty</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="text-align: center;">${order.pattern}</td>
                                <td style="text-align: center;">${order.qty} pcs</td>
                                <td style="text-align: center;">In Production</td>
                            </tr>
                        </tbody>
                    </table>

                    <div style="margin-top: 40px; border-top: 1px solid #ccc; padding-top: 10px; font-size: 11px; text-align: center; color: #777;">
                        Computer Generated Document - VortexFlow Operations
                    </div>
                </div>
            `;

            area.classList.remove('hidden');
            window.print();
            area.classList.add('hidden');
        }

        function renderOrders() {
            const cardGrid = document.getElementById('orders-card-grid');
            const isClient = currentUser && currentUser.role === 'client';

            if (orders.length === 0) {
                cardGrid.innerHTML = '<p class="text-xs text-slate-400 col-span-2">No purchase orders created yet.</p>';
                return;
            }

            cardGrid.innerHTML = orders.map(function (o) {
                return `
                    <div class="glass-panel p-4 rounded-xl border border-slate-800 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-indigo-400">${o.id}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">In Production</span>
                        </div>
                        <p class="text-xs font-semibold text-white">Pattern: ${o.pattern}</p>
                        <p class="text-[11px] text-slate-400">
                            Client: ${o.client} 
                            ${!isClient ? `| Foundry: <span class="text-indigo-300 font-semibold">${o.foundry}</span>` : ''}
                        </p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-800/60">
                            <span class="text-xs text-slate-300">Qty: ${o.qty} pcs</span>
                            <button onclick="printOrderPDF('${o.id}')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg flex items-center gap-1">
                                <i data-lucide="printer" class="w-3.5 h-3.5"></i> Print / PDF
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('stat-active-orders').textContent = orders.length;
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', function () {
            lucide.createIcons();

            document.getElementById('tab-role-admin').addEventListener('click', () => setLoginRole('admin'));
            document.getElementById('tab-role-client').addEventListener('click', () => setLoginRole('client'));

            document.getElementById('btn-direct-admin').addEventListener('click', () => loginUser('admin'));
            document.getElementById('btn-standard-login').addEventListener('click', () => {
                const isClientTab = document.getElementById('tab-role-client').classList.contains('bg-indigo-600');
                loginUser(isClientTab ? 'client' : 'admin');
            });

            document.getElementById('btn-logout').addEventListener('click', function () {
                document.getElementById('app-workspace').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            });

            document.getElementById('btn-open-create-modal').addEventListener('click', function () {
                document.getElementById('modal-create-order').classList.remove('hidden');
            });

            const closeModal = function () {
                document.getElementById('modal-create-order').classList.add('hidden');
            };

            document.getElementById('btn-close-modal').addEventListener('click', closeModal);
            document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

            document.getElementById('po-pattern').addEventListener('input', function (e) {
                const val = e.target.value.trim();
                if (PATTERN_CATALOG[val]) {
                    document.getElementById('po-foundry').value = PATTERN_CATALOG[val].foundry || '';
                    document.getElementById('po-client').value = PATTERN_CATALOG[val].client || '';
                }
            });

            document.getElementById('btn-submit-po').addEventListener('click', function () {
                const client = document.getElementById('po-client').value || 'Direct Client';
                const foundry = document.getElementById('po-foundry').value || 'Unassigned';
                const pattern = document.getElementById('po-pattern').value || 'N/A';
                const qty = document.getElementById('po-qty').value || '10';
                const targetDate = document.getElementById('po-date').value || '2026-10-30';

                const newOrder = {
                    id: 'PO-2026-' + Math.floor(100 + Math.random() * 900),
                    client: client,
                    foundry: foundry,
                    pattern: pattern,
                    qty: qty,
                    targetDate: targetDate
                };

                orders.unshift(newOrder);
                renderOrders();
                closeModal();
            });
        });
    </script>
</body>
</html>
